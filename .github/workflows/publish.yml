name: Build and deploy

# Runs only for main and for pull requests into main, so draft/* branches
# (pushed only to the private drafts repo) never trigger a build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QUARTO_VERSION: "1.10.18"
  R_VERSION: "4.5.2"
  NETLIFY_CLI_VERSION: "27.10.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      # Quarto starts R in each page's own folder, where the project .Rprofile
      # is not found, so point every R process at the restored renv library.
      - name: Use the renv library for every R process
        run: echo "R_LIBS_USER=$(Rscript -e 'cat(renv::paths$library())')" >> "$GITHUB_ENV"

      - name: Restore _freeze caches
        uses: actions/cache@v6
        with:
          path: |
            site/_freeze
            courses/*/_freeze
            books/*/_freeze
          key: freeze-${{ github.sha }}
          restore-keys: freeze-

      - name: Render site
        run: quarto render site

      - name: Render courses and books
        run: |
          shopt -s nullglob
          for project in courses/*/ books/*/; do
            if [ -f "${project}_quarto.yml" ]; then
              quarto render "$project"
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: >
          npx --yes netlify-cli@${{ env.NETLIFY_CLI_VERSION }} deploy
          --dir=_site --prod --no-build
          --message "main ${{ github.sha }}"

  # Optional final check for finished work: a pull request into main gets a
  # Netlify draft deploy and a comment with its URL. Skipped for forks, which
  # have no access to the secrets.
  preview:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy to Netlify (draft)
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@${{ env.NETLIFY_CLI_VERSION }} deploy \
            --dir=_site --no-build --json \
            --alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} ${{ github.sha }}" \
            > deploy.json
          echo "url=$(jq -r .deploy_url deploy.json)" >> "$GITHUB_OUTPUT"

      - name: Comment with the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh pr comment ${{ github.event.pull_request.number }}
          --repo ${{ github.repository }}
          --edit-last --create-if-none
          --body "Draft deploy for ${{ github.sha }}: ${{ steps.netlify.outputs.url }}"
